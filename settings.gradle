pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "immersive-machinery"
include("common", "neoforge")

// Both API consumers use the actual local 26.3 NeoForge project, including
// common's compile-only classpath. No Fabric binary or remote publication.
includeBuild("../ImmersiveAircraft") {
    dependencySubstitution {
        substitute module("net.conczin:immersive_aircraft") using project(":neoforge")
    }
}
